name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for this build (e.g. 1.0.0)'
        required: false
        default: 'dev'

permissions:
  contents: read

env:
  GO_VERSION: '1.26'
  WAILS_VERSION: 'v3.1.0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            arch: amd64
          - os: windows-latest
            platform: windows/arm64
            arch: arm64
          - os: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - os: macos-latest
            platform: darwin/arm64
            arch: arm64
          - os: macos-15-intel
            platform: darwin/amd64
            arch: amd64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # The wails3 CLI links GTK on Linux, so its dependencies come first.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libfuse2 rpm

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis jq --no-progress

      - name: Install Wails CLI
        shell: bash
        env:
          WAILS_VER: ${{ env.WAILS_VERSION }}
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@"$WAILS_VER"

      # ── Determine version ──
      - name: Determine version
        id: version
        shell: bash
        env:
          GH_REF: ${{ github.ref }}
          GH_REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GH_REF" == refs/tags/v* ]]; then
            version="${GH_REF_NAME#v}"
          else
            version="${INPUT_VERSION:-dev}"
          fi
          # Reject anything that isn't YYYY.MM.R or the literal "dev".
          # version flows into shell-expanded ldflags, so constrain it.
          if [[ "$version" != "dev" && ! "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$version' (expected YYYY.MM.R or 'dev')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Passed to wails3 task; empty for dev builds, which keep main.version = "dev".
          if [[ "$version" == "dev" ]]; then
            echo "task_version=" >> "$GITHUB_OUTPUT"
          else
            echo "task_version=VERSION=$version" >> "$GITHUB_OUTPUT"
          fi
          echo "Version: $version"

      - name: Stamp version into frontend/package.json
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' frontend/package.json > tmp.json
          mv tmp.json frontend/package.json

      - name: Stamp version into Windows resources
        if: runner.os == 'Windows' && steps.version.outputs.version != 'dev'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '
            .fixed.file_version = $v | .fixed.product_version = $v |
            .info["0409"].FileVersion = $v | .info["0409"].ProductVersion = $v
          ' build/windows/info.json > tmp.json
          mv tmp.json build/windows/info.json

      - name: Stamp version into Info.plist
        if: runner.os == 'macOS' && steps.version.outputs.version != 'dev'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          plutil -replace CFBundleVersion -string "$VERSION" build/darwin/Info.plist
          plutil -replace CFBundleShortVersionString -string "$VERSION" build/darwin/Info.plist

      # ── Build and package ──
      # Windows builds without cgo, so arm64 cross-compiles on the amd64 runner.
      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          TASK_VERSION: ${{ steps.version.outputs.task_version }}
        run: |
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          wails3 task windows:create:nsis:installer ARCH="$ARCH" ${TASK_VERSION:+"$TASK_VERSION"}
          mv "bin/Vervet-${ARCH}-installer.exe" "Vervet-windows-${ARCH}-installer.exe"

      - name: Package Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: Compress-Archive "bin/Vervet.exe" "Vervet-windows-$env:ARCH-portable.zip"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        env:
          TASK_VERSION: ${{ steps.version.outputs.task_version }}
        run: wails3 task linux:build ${TASK_VERSION:+"$TASK_VERSION"}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          ARCH: ${{ matrix.arch }}
          TASK_VERSION: ${{ steps.version.outputs.task_version }}
        run: wails3 task darwin:package ARCH="$ARCH" ${TASK_VERSION:+"$TASK_VERSION"}

      # ── Package: Linux AppImage ──
      # Built with linuxdeploy rather than `wails3 generate appimage`: Wails 3.1
      # downloads an unpinned linuxdeploy and has no way to add the xdg-open shim.
      - name: Package AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          DEPLOY_GTK_VERSION: "4"
        run: |
          # Download linuxdeploy and GTK plugin (pinned to specific commits)
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20240109-1/linuxdeploy-x86_64.AppImage -O linuxdeploy
          chmod +x linuxdeploy

          wget -q https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/b5eb8d05b4c0ed40107fe2158c5d8527f94568ef/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-plugin-gtk.sh

          # Workaround: add WEBKIT_DISABLE_COMPOSITING_MODE to GTK plugin
          sed -i '/XDG_DATA_DIRS/a export WEBKIT_DISABLE_COMPOSITING_MODE=1' linuxdeploy-plugin-gtk.sh

          # libwayland-client must come from the host: the host's Mesa loads it,
          # and Ubuntu's older copy makes EGL fail on newer distros (Fedora 44),
          # which aborts WebKit and leaves a white window. The plugin runs its own
          # linuxdeploy, so it needs the exclusion as well as the call below.
          # Upstream excludes this library too; a newer linuxdeploy may make this
          # patch unnecessary:
          # https://github.com/AppImageCommunity/pkg2appimage/blob/master/excludelist
          # https://gitlab.freedesktop.org/mesa/mesa/-/issues/11316
          sed -i 's|"[$]LINUXDEPLOY" --appdir="[$]APPDIR"|& --exclude-library="libwayland-client*"|' linuxdeploy-plugin-gtk.sh

          # Initial linuxdeploy run to set up AppDir
          ./linuxdeploy --appdir AppDir

          # Copy WebKitGTK 6.0's helper processes and injected bundle into AppDir
          pushd AppDir
          for name in WebKitNetworkProcess WebKitWebProcess WebKitGPUProcess libwebkitgtkinjectedbundle.so; do
            # --parents recreates each file's directory under AppDir.
            find /usr/lib* -path '*webkitgtk-6.0*' -name "$name" -exec cp --parents '{}' . \;
          done
          popd
          if [ -z "$(find AppDir -name WebKitWebProcess)" ]; then
            echo "::error::WebKitGTK 6.0 helper processes were not found"
            exit 1
          fi

          # Use our own AppRun rather than a prebuilt binary from upstream
          install -m 755 build/linux/AppRun AppDir/AppRun

          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps
          cp build/linux/Vervet-512.png AppDir/usr/share/icons/hicolor/512x512/apps/Vervet.png

          mkdir -p AppDir/usr/bin
          cp bin/Vervet AppDir/usr/bin/
          install -m 755 build/linux/xdg-open AppDir/usr/bin/xdg-open

          # Run linuxdeploy with GTK plugin to produce AppImage
          ./linuxdeploy --appdir AppDir \
            --exclude-library 'libwayland-client*' \
            --output appimage \
            --plugin gtk \
            -e bin/Vervet \
            -d build/linux/com.blacktau.vervet.desktop \
            -i build/linux/Vervet-512.png

          # Fail rather than ship the white window if the exclusion stops working
          if [ -n "$(find AppDir -name 'libwayland-client.so*')" ]; then
            echo "::error::libwayland-client was bundled into the AppImage"
            exit 1
          fi

          # Rename output (linuxdeploy names it based on the desktop file)
          mv Vervet-x86_64.AppImage "Vervet-linux-amd64.AppImage"

      # ── Package: Linux .deb and .rpm ──
      - name: Package deb and rpm
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          wails3 task linux:create:deb VERSION="$VERSION"
          wails3 task linux:create:rpm VERSION="$VERSION"
          mv bin/vervet.deb Vervet-linux-amd64.deb
          mv bin/vervet.rpm Vervet-linux-amd64.rpm

      # COPR rebuilds the binary RPM from this source RPM, which nfpm can't make.
      - name: Package src.rpm
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Create tarball with directory name matching spec (name-version)
          mkdir -p "vervet-$VERSION"
          cp bin/Vervet "vervet-$VERSION/"
          cp build/linux/com.blacktau.vervet.desktop "vervet-$VERSION/"
          cp build/linux/Vervet-512.png "vervet-$VERSION/Vervet.png"
          tar czf "vervet-$VERSION.tar.gz" "vervet-$VERSION/"

          mkdir -p ~/rpmbuild/{SOURCES,SPECS,SRPMS,RPMS}
          cp "vervet-$VERSION.tar.gz" ~/rpmbuild/SOURCES/
          sed "s/VERSION_PLACEHOLDER/$VERSION/" build/linux/vervet.spec > ~/rpmbuild/SPECS/vervet.spec

          rpmbuild -bs ~/rpmbuild/SPECS/vervet.spec
          cp ~/rpmbuild/SRPMS/vervet-*.src.rpm "Vervet-linux-amd64.src.rpm"

      # ── Package: macOS DMG ──
      - name: Package DMG
        if: runner.os == 'macOS'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir dmg
          mv bin/Vervet.app dmg/
          create-dmg \
            --volname "Vervet" \
            --no-internet-enable \
            --app-drop-link 480 180 \
            "Vervet-macos-${ARCH}.dmg" \
            dmg/

      # ── Upload ──
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: Vervet-windows-${{ matrix.arch }}-installer.exe
          path: Vervet-windows-${{ matrix.arch }}-installer.exe
          if-no-files-found: error

      - name: Upload Windows portable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: Vervet-windows-${{ matrix.arch }}-portable.zip
          path: Vervet-windows-${{ matrix.arch }}-portable.zip
          if-no-files-found: error

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: Vervet-linux-amd64.AppImage
          path: Vervet-linux-amd64.AppImage
          if-no-files-found: error

      - name: Upload Linux deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: Vervet-linux-amd64.deb
          path: Vervet-linux-amd64.deb
          if-no-files-found: error

      - name: Upload Linux rpm
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: Vervet-linux-amd64.rpm
          path: Vervet-linux-amd64.rpm
          if-no-files-found: error

      - name: Upload Linux src.rpm
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: Vervet-linux-amd64.src.rpm
          path: Vervet-linux-amd64.src.rpm
          if-no-files-found: error

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: Vervet-macos-${{ matrix.arch }}.dmg
          path: Vervet-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: release
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/Vervet-windows-*
            artifacts/Vervet-linux-*
            artifacts/Vervet-macos-*

      - name: Upload RPM to COPR
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
        run: |
          sudo apt-get install -y python3-pip
          pip install copr-cli

          mkdir -p ~/.config
          cat > ~/.config/copr <<COPR_EOF
          [copr-cli]
          login = ${COPR_LOGIN}
          username = ${COPR_USERNAME}
          token = ${COPR_TOKEN}
          copr_url = https://copr.fedorainfracloud.org
          COPR_EOF
          sed -i 's/^[[:space:]]*//' ~/.config/copr

          copr-cli build blacktau/vervet artifacts/Vervet-linux-amd64.src.rpm
