name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GO_VERSION: '1.26'
  # The shell tests run the real mongosh, and its output framing depends on
  # mongosh internals (see outputPreamble), so the version is pinned. Bump both
  # together: the checksum is of the linux-x64 tarball.
  MONGOSH_VERSION: '2.7.0'
  MONGOSH_SHA256: 'b0c21bb6d0c0dfbc0e97df4408a8ee52bcfc922641f5f28e0446c5e71e8da262'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-versions:
    name: Go tests (MongoDB ${{ matrix.mongodb }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Every MongoDB version that has not reached end of life. Keep in step
        # with the list in README.md: https://endoflife.date/mongodb
        #
        # 8.0 and 8.3 refuse to start on ubuntu-latest's kernel (7.0), so they run
        # on an older one (6.8). See SERVER-121912 and SERVER-125742.
        include:
          - { mongodb: '7.0', runner: ubuntu-latest }
          - { mongodb: '8.0', runner: ubuntu-22.04 }
          - { mongodb: '8.3', runner: ubuntu-22.04 }
          - { mongodb: '9.0', runner: ubuntu-latest }
    env:
      VERVET_TEST_MONGO_IMAGE: mongo:${{ matrix.mongodb }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # internal/shell's integration tests skip when mongosh is missing, so a
      # failed install must fail here, not turn into a quiet skip.
      - name: Install mongosh
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mongosh.tgz" "https://downloads.mongodb.com/compass/mongosh-${MONGOSH_VERSION}-linux-x64.tgz"
          echo "${MONGOSH_SHA256}  $RUNNER_TEMP/mongosh.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mongosh.tgz" -C "$RUNNER_TEMP"
          bin="$RUNNER_TEMP/mongosh-${MONGOSH_VERSION}-linux-x64/bin"
          "$bin/mongosh" --version
          echo "$bin" >> "$GITHUB_PATH"

      # The integration tag is a superset: it compiles the unit tests too.
      # Without it, coverage reads ~55% and connections/collections/databases/
      # indexes all look untested. ubuntu-latest ships Docker, so
      # testcontainers-go works with no extra setup.
      #
      # Scoped to ./internal/... deliberately: the root package embeds
      # frontend/dist, which is gitignored and absent from a CI checkout.
      - name: Test with coverage
        run: go test -tags integration -race -coverprofile=cover.out ./internal/...

      # On one version only: the baseline is one number, and a few tests skip on
      # servers without the feature they need.
      - name: Enforce coverage ratchet
        if: matrix.mongodb == '7.0'
        run: bash scripts/check-coverage.sh cover.out coverage-baseline.txt

  # "Go tests" is a required check, and the matrix jobs have their own names, so
  # this one reports their result. It runs even when they fail: a required check
  # that is skipped counts as passing.
  backend:
    name: Go tests
    runs-on: ubuntu-latest
    needs: backend-versions
    if: always()
    steps:
      - name: Check every MongoDB version passed
        env:
          RESULT: ${{ needs.backend-versions.result }}
        run: test "$RESULT" = success

  frontend:
    name: Frontend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and type-check
        run: bun run lint

      # CI=true is set by GitHub Actions, which disables vitest's autoUpdate,
      # so a build cannot rewrite its own coverage gate.
      - name: Test with coverage
        run: bun run test:ci
